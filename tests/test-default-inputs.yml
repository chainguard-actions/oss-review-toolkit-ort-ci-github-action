---
# Test: Default inputs - sw-name and sw-version derived from git, default ort-home-path
name: Test ORT default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Use the workspace as the ORT config path - it's already a git repo with a remote,
          # so the ort-config step will skip cloning (non-empty dir) and
          # ort-config-url-and-revision will succeed (valid git repo).
          ort-config-path: '${{ github.workspace }}'
          # Only run steps that don't require Docker
          run: 'none'
          # No sw-name or sw-version - should be derived from git

      - name: Assert results-path output is set (default ort-home-path)
        env:
          ACTUAL: ${{ steps.action.outputs.results-path }}
        run: |
          echo "results-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: results-path output is empty"
            exit 1
          fi
          # Default ort-home-path is '.ort', so results should be under $HOME/.ort/ort-results
          if echo "$ACTUAL" | grep -q "\.ort/ort-results"; then
            echo "PASS: results-path uses default .ort home path"
          else
            echo "FAIL: results-path '$ACTUAL' does not match expected pattern '*/.ort/ort-results'"
            exit 1
          fi

      - name: Assert SW_VERSION env var is set (derived from git short SHA)
        run: |
          echo "SW_VERSION: $SW_VERSION"
          if [ -z "$SW_VERSION" ]; then
            echo "FAIL: SW_VERSION env var is not set"
            exit 1
          fi
          # Should not be 'unknown' since we have a git repo
          if [ "$SW_VERSION" = "unknown" ]; then
            echo "WARN: SW_VERSION is 'unknown' - git short SHA could not be determined"
          else
            echo "PASS: SW_VERSION is set to '$SW_VERSION'"
          fi

      - name: Assert SW_NAME env var is set (derived from git remote or 'unknown')
        run: |
          echo "SW_NAME: $SW_NAME"
          if [ -z "$SW_NAME" ]; then
            echo "FAIL: SW_NAME env var is not set"
            exit 1
          fi
          echo "PASS: SW_NAME is set to '$SW_NAME'"

      - name: Assert ORT_RESULTS_ARTIFACT_NAME env var is set
        run: |
          echo "ORT_RESULTS_ARTIFACT_NAME: $ORT_RESULTS_ARTIFACT_NAME"
          if [ -z "$ORT_RESULTS_ARTIFACT_NAME" ]; then
            echo "FAIL: ORT_RESULTS_ARTIFACT_NAME env var is not set"
            exit 1
          fi
          # Should start with 'ort-results-'
          if echo "$ORT_RESULTS_ARTIFACT_NAME" | grep -q "^ort-results-"; then
            echo "PASS: ORT_RESULTS_ARTIFACT_NAME starts with 'ort-results-'"
          else
            echo "FAIL: ORT_RESULTS_ARTIFACT_NAME '$ORT_RESULTS_ARTIFACT_NAME' does not start with 'ort-results-'"
            exit 1
          fi
