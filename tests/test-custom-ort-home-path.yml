---
# Test: Custom ort-home-path input - verifies directory structure is created at custom path
name: Test ORT custom ort-home-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Use the workspace as the ORT config path - it's already a git repo with a remote,
          # so the ort-config step will skip cloning (non-empty dir) and
          # ort-config-url-and-revision will succeed (valid git repo).
          ort-config-path: '${{ github.workspace }}'
          # Only run steps that don't require Docker
          run: 'none'
          sw-name: 'test-project'
          sw-version: '0.1.0'
          ort-home-path: '.ort-custom'

      - name: Assert results-path uses custom ort-home-path
        env:
          ACTUAL: ${{ steps.action.outputs.results-path }}
        run: |
          echo "results-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: results-path output is empty"
            exit 1
          fi
          # Should contain the custom home path
          if echo "$ACTUAL" | grep -q "\.ort-custom/ort-results"; then
            echo "PASS: results-path uses custom ort-home-path '.ort-custom'"
          else
            echo "FAIL: results-path '$ACTUAL' does not contain '.ort-custom/ort-results'"
            exit 1
          fi

      - name: Assert custom ORT home directory structure was created
        run: |
          ORT_HOME="$HOME/.ort-custom"
          echo "Checking custom ORT home directory structure at: $ORT_HOME"
          for subdir in cache config ort-results; do
            if [ ! -d "$ORT_HOME/$subdir" ]; then
              echo "FAIL: expected directory '$ORT_HOME/$subdir' does not exist"
              exit 1
            fi
            echo "  OK: $ORT_HOME/$subdir exists"
          done
          echo "PASS: all expected ORT home subdirectories exist under custom path"

      - name: Assert results-advisor-path uses custom ort-home-path
        env:
          ACTUAL: ${{ steps.action.outputs.results-advisor-path }}
        run: |
          echo "results-advisor-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: results-advisor-path output is empty"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "\.ort-custom"; then
            echo "PASS: results-advisor-path uses custom ort-home-path"
          else
            echo "FAIL: results-advisor-path '$ACTUAL' does not use custom ort-home-path"
            exit 1
          fi
